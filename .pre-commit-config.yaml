repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # SEC-001. Database connection strings reach this repo's runtime through
  # Doppler; this stops one being pasted into a file and committed. Bypassable
  # with --no-verify — the CI gitleaks pass over full history is the control.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  # ADR-0016. The same command CI runs as `facts check`: regenerates
  # facts.json before every commit, and stops the commit when it changed
  # (add facts.json and commit again).
  - repo: local
    hooks:
      - id: facts
        name: facts generate
        entry: uvx --from miniapppolis-common-utils facts generate
        language: system
        pass_filenames: false
        always_run: true
