# Applies the plan railway-plan.yml pinned on the pull request, when that
# pull request lands on main. It applies exactly the reviewed change set:
# if the environment changed since (a dashboard edit) or .railway/ is not
# the planned tree, it fails and the pull request needs a fresh plan. A
# push to main that did not come through a pull request has no plan and
# fails by design. The steps live in the shared workflow in
# mini-app-polis/.github (MINI-70). MINI-67.
name: Railway apply

on:
  push:
    branches: [main]
    paths: [".railway/**"]

# pull-requests: read lets the action find the merged pull request, and
# actions: read lets it download that pull request's plan.
permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  apply:
    uses: mini-app-polis/.github/.github/workflows/railway-apply.yml@v3
    with:
      # Applying a change to db-drill redeploys it, which stops a drill run
      # before it can delete its forks (README). The drill runs at 09:43 UTC
      # on the 2nd and takes about fifteen minutes.
      blocked-window: "02 09-10"
      blocked-window-reason: "db-drill may be running (09:43 UTC on the 2nd)"
    secrets:
      railway-token: ${{ secrets.RAILWAY_TOKEN }}
