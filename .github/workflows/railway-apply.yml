# Plans afresh and applies .railway/railway.ts to production on every push
# to main that changes it, or by hand (Actions → Railway apply → Run
# workflow). Removing a service or a variable is destructive and applies
# only if the pull request the commit came from is labelled allow-destroy.
# The steps live in the shared workflow in mini-app-polis/.github,
# modelled on mini-app-polis/infra's terraform.yml.
name: Railway apply

on:
  push:
    branches: [main]
    paths: [".railway/**", ".github/workflows/railway-apply.yml"]
  workflow_dispatch:

# pull-requests: read finds the pull request a commit came from, for its
# allow-destroy label.
permissions:
  contents: read
  pull-requests: read

jobs:
  apply:
    if: github.ref_name == 'main'
    uses: mini-app-polis/.github/.github/workflows/railway-apply.yml@v3
    with:
      # Applying a change to db-drill redeploys it, which stops a drill run
      # before it can delete its forks (README). The drill runs at 09:43 UTC
      # on the 2nd and takes about fifteen minutes.
      blocked-window: "02 09-10"
      blocked-window-reason: "db-drill may be running (09:43 UTC on the 2nd)"
    secrets:
      railway-token: ${{ secrets.RAILWAY_TOKEN }}
