name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over full
  # history, the dependency audit against the resolved set, and semgrep.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: python
      package-manager: uv

  # Lock check, lint, format, typecheck and coverage, from the shared
  # workflow so every cog's `test` stage is the same stage (CD-026).
  test:
    uses: mini-app-polis/.github/.github/workflows/python-test.yml@v3
    with:
      # TEST-006: coverage measured on every run, reported in the terminal.
      pytest-args: "--cov=db_ops --cov-report=term-missing"
      # TEST-012: typechecked against [tool.mypy].
      typecheck: "uv run mypy src/"
      # No terraform-dir: this repo owns no infrastructure (ecosystem-standards ADR-0010).

  release:
    name: Release
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # VER-006: semantic-release and its plugins from the fleet's shared lockfile.
    uses: mini-app-polis/.github/.github/workflows/release.yml@v3
    # The release commit is authored as Kaiano rather than
    # semantic-release-bot: Railway holds a deploy for approval when the
    # commit's author isn't on the Railway team, and a bot can't be invited.
    with:
      git-author-name: Kaiano Levine
      git-author-email: kaiano.levine@gmail.com

  # Conformance is graded when the repository changes, and this is where
  # that is said. The evaluation runs after this job ends, so what the job
  # reports is whether the request landed — never what was found.
  #
  # The repo is `status: development` in the registry, so the fleet sweep
  # skips it and this job is the only evaluation it gets.
  evaluate:
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
